name: Fly setup

# Manual, idempotent, one-time bootstrap of a Fly.io app (#3) — no local CLI needed.
# Needs secret FLY_API_TOKEN = Fly org token (dashboard → Tokens). Email: secrets SES_ACCESS_KEY_ID + SES_SECRET_ACCESS_KEY (IAM user, ses:SendRawEmail) or SMTP_URL → real email, else console.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target'
        type: choice
        options: [staging, production]
        default: staging
      org:
        description: 'Fly organization slug'
        required: true
        default: 'personal'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SMTP_URL: ${{ secrets.SMTP_URL }}
      SES_ACCESS_KEY_ID: ${{ secrets.SES_ACCESS_KEY_ID }}
      SES_SECRET_ACCESS_KEY: ${{ secrets.SES_SECRET_ACCESS_KEY }}
      SES_REGION: eu-central-2
      FLY_APP: ${{ inputs.environment == 'production' && 'monkeyworkout-prod' || 'monkeyworkout-staging' }}
      REGION: fra
      HOSTNAME: ${{ inputs.environment == 'production' && 'workout.monkeygrade.cloud' || 'workout-staging.monkeygrade.cloud' }}
      ORG: ${{ inputs.org }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: App
        run: |
          if flyctl status -a "$FLY_APP" >/dev/null 2>&1; then echo "app exists"
          else flyctl apps create "$FLY_APP" --org "$ORG"; fi
      - name: Volume
        run: |
          if [ "$(flyctl volumes list -a "$FLY_APP" --json | jq length)" -gt 0 ]; then echo "volume exists"
          else flyctl volumes create data -a "$FLY_APP" -r "$REGION" -s 1 -y; fi
      # IAM user (ses:SendRawEmail) → SES SMTP password (AWS SigV4 derivation), unless SMTP_URL is given.
      - name: Derive SES SMTP URL
        if: env.SMTP_URL == '' && env.SES_ACCESS_KEY_ID != ''
        run: |
          url=$(python3 - <<'PY'
          import base64, hashlib, hmac, os, urllib.parse
          def h(k, m): return hmac.new(k, m.encode(), hashlib.sha256).digest()
          sig = ('AWS4' + os.environ['SES_SECRET_ACCESS_KEY']).encode()
          for m in ('11111111', os.environ['SES_REGION'], 'ses', 'aws4_request', 'SendRawEmail'):
              sig = h(sig, m)
          pw = base64.b64encode(b'\x04' + sig).decode()
          print(f"smtp://{os.environ['SES_ACCESS_KEY_ID']}:{urllib.parse.quote(pw, safe='')}@email-smtp.{os.environ['SES_REGION']}.amazonaws.com:587")
          PY
          )
          echo "::add-mask::$url"
          echo "SMTP_URL=$url" >> "$GITHUB_ENV"
      # Generated in the runner, sent via stdin, never printed. Existing secrets are kept.
      - name: Secrets
        run: |
          have=$(flyctl secrets list -a "$FLY_APP" --json | jq -r '.[] | (.Name // .name)')
          {
            echo "$have" | grep -qx JWT_SECRET  || echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "$have" | grep -qx CODE_PEPPER || echo "CODE_PEPPER=$(openssl rand -base64 32 | tr -d '\n')"
            if [ -n "$SMTP_URL" ]; then echo "SMTP_URL=$SMTP_URL"
            else echo "$have" | grep -qxE 'SMTP_URL|MAIL_TRANSPORT' || echo "MAIL_TRANSPORT=console"; fi
          } > "$RUNNER_TEMP/secrets.env"
          # Real SMTP configured → drop the console fallback.
          if [ -n "$SMTP_URL" ] && echo "$have" | grep -qx MAIL_TRANSPORT; then flyctl secrets unset --stage -a "$FLY_APP" MAIL_TRANSPORT; fi
          if [ -s "$RUNNER_TEMP/secrets.env" ]; then flyctl secrets import --stage -a "$FLY_APP" < "$RUNNER_TEMP/secrets.env"; fi
          rm -f "$RUNNER_TEMP/secrets.env"
          flyctl secrets list -a "$FLY_APP"
      - name: TLS certificate
        run: |
          flyctl certs show "$HOSTNAME" -a "$FLY_APP" >/dev/null 2>&1 || flyctl certs add "$HOSTNAME" -a "$FLY_APP"
          {
            echo "### DNS for \`$HOSTNAME\`"
            echo "CNAME \`${HOSTNAME%%.*}\` → \`$FLY_APP.fly.dev\` (DNS only)"
            echo '```'
            flyctl certs show "$HOSTNAME" -a "$FLY_APP" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
