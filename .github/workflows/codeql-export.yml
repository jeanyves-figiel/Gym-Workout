name: CodeQL export

# Runs the same CodeQL suite as default setup and prints every result (no upload), so alerts can be
# triaged without the Security tab: the Claude session token cannot read the alerts API (#964).
# Manual, and on PRs that change this file. Default setup stays the source of the Security tab.
on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Language'
        type: choice
        options: [swift, javascript-typescript, python, actions]
        default: swift
  pull_request:
    paths: ['.github/workflows/codeql-export.yml']

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ${{ (inputs.language || 'swift') == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      LANG_ID: ${{ inputs.language || 'swift' }}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ env.LANG_ID }}
          build-mode: ${{ env.LANG_ID == 'swift' && 'autobuild' || 'none' }}
      - if: env.LANG_ID == 'swift'
        uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: sarif
      - name: Results
        run: |
          # One line per result: level, rule, file:line, message.
          jq -r '.runs[] | . as $r | .results[] |
            "\(.level // "warning")\t\(.ruleId)\t\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)\t\(.message.text | gsub("\n"; " ") | .[0:200])"' sarif/*.sarif | sort | tee results.tsv
          echo "Results: $(wc -l < results.tsv)" | tee -a "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' results.tsv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: codeql-${{ env.LANG_ID }}
          path: sarif/
          retention-days: 7
