name: TestFlight crashes

# Prints the newest TestFlight crash reports testers shared (exception + crashed thread), full logs as artifact.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many recent crash reports'
        default: '5'

permissions:
  contents: read

jobs:
  crashes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APP_ID: '6819971090'
      LIMIT: ${{ inputs.limit || '5' }}
      OUT_DIR: ${{ github.workspace }}/crashes
    steps:
      - uses: actions/checkout@v7
      - run: pip install --quiet 'pyjwt[crypto]==2.9.0'
      - name: Fetch crash reports
        run: |
          if [ -z "$ASC_KEY_ID" ]; then echo "::warning::ASC_* secrets not set; skipping."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/asc"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"; else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"; fi
          python3 .github/scripts/asc_crashes.py
          rm -rf "$RUNNER_TEMP/asc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-crashes
          path: crashes/
          retention-days: 7
          if-no-files-found: ignore
