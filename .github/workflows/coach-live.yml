name: Coach live check

# Manual: one real Ask Coach call (Claude API) with the environment's ANTHROPIC_API_KEY, or (check: voice) one real
# studio-voice recording with Amazon Polly (#395). Prints the answer or the API error.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
      check:
        type: choice
        options: [chat, voice]
        default: chat

permissions:
  contents: read

jobs:
  call:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - if: inputs.check != 'voice'
        run: node --disable-warning=ExperimentalWarning scripts/coach-live.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      - if: inputs.check == 'voice'
        run: node --disable-warning=ExperimentalWarning scripts/voice-live.ts
        env:
          SES_ACCESS_KEY_ID: ${{ secrets.SES_ACCESS_KEY_ID }}
          SES_SECRET_ACCESS_KEY: ${{ secrets.SES_SECRET_ACCESS_KEY }}
