name: Week challenge review

# Manual (#748): list member suggestions for the week challenge waiting for review, or approve / reject one.
# Approved ones join the member-week vote (last ISO week of each month). Runs backend/src/admin.ts on the Fly machine
# (as the app user, same database). No new secrets needed; the log shows nicknames only.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target'
        type: choice
        options: [staging, production]
        default: production
      action:
        description: 'list, approve or reject'
        type: choice
        options: [list, approve, reject]
        default: list
      id:
        description: 'Suggestion id (approve / reject), from list'
        required: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ inputs.environment == 'production' && 'monkeyworkout-prod' || 'monkeyworkout-staging' }}
      HOST: ${{ inputs.environment == 'production' && 'workout.monkeygrade.cloud' || 'workout-staging.monkeygrade.cloud' }}
      ACTION: ${{ inputs.action }}
      ID: ${{ inputs.id }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master, pinned (#432)
      - name: Validate inputs
        run: |
          if [ "$ACTION" != list ] && ! printf '%s' "$ID" | grep -Eq '^[0-9a-f-]{36}$'; then echo "::error::Suggestion id required"; exit 1; fi
      - name: Wake the machine
        run: curl -fsS --retry 5 --retry-delay 3 "https://$HOST/healthz"
      - name: Run
        run: |
          case "$ACTION" in
            list) ARGS="challenges" ;;
            approve) ARGS="challenge-approve $ID" ;;
            reject) ARGS="challenge-reject $ID" ;;
          esac
          # The entrypoint drops to the app user so the SQLite files keep their owner.
          flyctl ssh console -a "$FLY_APP" -C "docker-entrypoint.sh node --disable-warning=ExperimentalWarning /app/src/admin.ts $ARGS"
