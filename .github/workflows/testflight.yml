name: TestFlight (Staging)

# Archives the "MonkeyWorkout Staging" scheme (staging API) and uploads it to App Store Connect → TestFlight.
# Signing: Xcode automatic/cloud signing driven by an App Store Connect API key (no certificates in the repo).
# Skips with a warning until the ASC_* secrets exist (see ios/README.md → TestFlight).
# Manual only: builds ship when all open work streams are merged, not on every merge to main.
on:
  workflow_dispatch:
    inputs:
      prune_ci_certs:
        description: 'Revoke all old CI-made development certificates ("Created via API") before archiving'
        type: boolean
        default: false
      same_whats_new:
        description: "Rebuild without new release content: keep the last build's What's new page"
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  # Tags each uploaded build (testflight-<build>) for the What's new check.
  contents: write

jobs:
  upload:
    name: Archive + upload
    # Newest Xcode on macos-26: iOS 27 SDK, full-screen iPhone Duo (#120).
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 not set; skipping TestFlight upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          fetch-depth: 0
      - name: What's new for this release
        # Every release shows a What's new page on first open (#183): its notes must change since the last build.
        if: steps.secrets.outputs.ok == 'true'
        run: |
          if [ "${{ inputs.same_whats_new }}" = "true" ]; then
            .github/scripts/check_whats_new.sh
          else
            .github/scripts/check_whats_new.sh --since-last-testflight
          fi
      - name: Select newest Xcode
        if: steps.secrets.outputs.ok == 'true'
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: API key
        if: steps.secrets.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          KEY="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          # Accept the .p8 pasted as-is or base64-encoded.
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Signing certificates
        if: steps.secrets.outputs.ok == 'true'
        run: |
          pip3 install --quiet --break-system-packages 'pyjwt[crypto]==2.9.0' || pip3 install --quiet 'pyjwt[crypto]==2.9.0'
          if [ "${{ inputs.prune_ci_certs }}" = "true" ]; then
            python3 .github/scripts/asc_ci_certs.py prune
          else
            python3 .github/scripts/asc_ci_certs.py list
          fi
      - name: Generate project
        if: steps.secrets.outputs.ok == 'true'
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Archive (Staging)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/MonkeyWorkout.xcodeproj \
            -scheme "MonkeyWorkout Staging" \
            -configuration Staging \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MonkeyWorkout.xcarchive" \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -n 80
      # Complications (#190): show what the archive ships inside the Watch app, with the extension's signed entitlements.
      - name: Check Watch complications in archive
        if: steps.secrets.outputs.ok == 'true'
        run: |
          W="$RUNNER_TEMP/MonkeyWorkout.xcarchive/Products/Applications/MonkeyWorkout.app/Watch/MonkeyWorkoutWatch.app"
          find "$W" -maxdepth 3 -name '*.appex' -print
          X="$W/PlugIns/MonkeyWorkoutWatchComplications.appex"
          [ -d "$X" ] || { echo "::error::MonkeyWorkoutWatchComplications.appex missing from the Watch app"; exit 1; }
          plutil -p "$X/Info.plist" | grep -E 'CFBundleIdentifier|NSExtensionPointIdentifier|MWAppGroup|MinimumOSVersion'
          codesign -d --entitlements - "$X" 2>/dev/null | grep -A3 application-groups || echo "::warning::no App Group entitlement on the complications extension"
          codesign -d --entitlements - "$W" 2>/dev/null | grep -A3 application-groups || echo "::warning::no App Group entitlement on the Watch app"
          # Home Screen widgets (#297): the iPhone app writes, the widget extension reads the same App Group.
          A="$RUNNER_TEMP/MonkeyWorkout.xcarchive/Products/Applications/MonkeyWorkout.app"
          codesign -d --entitlements - "$A" 2>/dev/null | grep -A3 application-groups || echo "::warning::no App Group entitlement on the iPhone app: Home Screen widgets stay empty"
          codesign -d --entitlements - "$A/PlugIns/MonkeyWorkoutWidgets.appex" 2>/dev/null | grep -A3 application-groups || echo "::warning::no App Group entitlement on the widget extension: Home Screen widgets stay empty"
      - name: Export + upload to App Store Connect
        if: steps.secrets.outputs.ok == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>U7VAR53G86</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MonkeyWorkout.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 80
          echo "Uploaded build ${{ github.run_number }} (Staging → workout-staging.monkeygrade.cloud). Appears in TestFlight after Apple processing." >> "$GITHUB_STEP_SUMMARY"
      - name: Tag build
        if: steps.secrets.outputs.ok == 'true'
        run: |
          git tag "testflight-${{ github.run_number }}"
          git push origin "testflight-${{ github.run_number }}"
      - name: Revoke this run's development certificate
        # Xcode made it for this runner only; its private key is gone with the runner, so keep the account under Apple's cap.
        if: always() && steps.secrets.outputs.ok == 'true'
        run: |
          cd "$RUNNER_TEMP"
          security find-certificate -a -c "Apple Development" -p 2>/dev/null \
            | awk '/BEGIN CERT/{f="devcert"++n".pem"} f{print > f} /END CERT/{close(f); f=""}'
          SERIALS=$(for f in devcert*.pem; do [ -f "$f" ] && openssl x509 -in "$f" -noout -serial | cut -d= -f2; done)
          rm -f devcert*.pem
          if [ -z "$SERIALS" ]; then echo "No development certificate in this runner's keychain"; exit 0; fi
          python3 "$GITHUB_WORKSPACE/.github/scripts/asc_ci_certs.py" revoke-serials $SERIALS
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  distribute:
    name: Add to TestFlight group
    needs: upload
    uses: ./.github/workflows/testflight-distribute.yml
    secrets: inherit
