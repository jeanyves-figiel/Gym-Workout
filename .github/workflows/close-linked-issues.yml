name: Close linked issues

# GitHub only auto-closes the first number in "Closes #1, #2, #3".
# On merge to main, close every issue listed after Closes/Fixes/Resolves.

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close every listed issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          nums=$(printf '%s' "$BODY" \
            | perl -0ne 'while (/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b:?\s+((?:#\d+(?:\s*(?:,|\band\b|&)\s*)*)+)/gi) { print "$1\n" }' \
            | grep -o '[0-9]\+' | sort -un)
          for n in $nums; do
            info=$(gh api "repos/$REPO/issues/$n" --jq '[.state, (.pull_request != null)] | @tsv' 2>/dev/null) || continue
            state=${info%%$'\t'*}; is_pr=${info##*$'\t'}
            [ "$state" = open ] && [ "$is_pr" = false ] || continue
            gh issue close "$n" -R "$REPO" --reason completed --comment "Closed by #$PR (merged to main)."
            echo "closed #$n"
          done
