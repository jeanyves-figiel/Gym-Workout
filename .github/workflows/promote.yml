name: Promote to production

# Manual only. Re-tags the exact API image already validated on staging — no rebuild.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to promote (blank = image currently on staging)'
        required: false
        default: ''

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - id: src
        env:
          SHA: ${{ inputs.sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-api"
          if [ -n "$SHA" ]; then SRC="$IMAGE:sha-$SHA"; else SRC="$IMAGE:staging"; fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag same image as prod
        id: tag
        env:
          SRC: ${{ steps.src.outputs.src }}
          IMAGE: ${{ steps.src.outputs.image }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$SRC" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools create -t "$IMAGE:prod" "$IMAGE@$DIGEST"
          echo "ref=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Promoted \`$SRC\` → \`prod\` ($DIGEST)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Check Fly token
        id: gate
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN not set — prod tag updated, no deploy triggered."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - if: steps.gate.outputs.skip != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure flyctl
        if: steps.gate.outputs.skip != 'true'
        # setup-flyctl occasionally finishes without flyctl on PATH (staging deploy run 38084710625); fall back to the installer.
        run: |
          command -v flyctl && exit 0
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      # Same digest as staging, mirrored to Fly's registry.
      - name: Deploy to Fly production
        if: steps.gate.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: monkeyworkout-prod
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          flyctl auth docker
          DST="registry.fly.io/$FLY_APP:${REF##*@sha256:}"
          docker pull "$REF"
          docker tag "$REF" "$DST"
          docker push "$DST"
          flyctl deploy --config backend/fly.production.toml --app "$FLY_APP" --image "$DST"
          echo "Deployed \`$REF\` to $FLY_APP" >> "$GITHUB_STEP_SUMMARY"
