name: Fly backups

# Backups of the API database (#310). Two layers:
# - Fly volume snapshots: daily, automatic, stored off the volume (cover losing the volume). Retention set here.
# - App backups: the API writes /data/backups/app-<day>.db once a day (VACUUM INTO + quick_check), keeps 7.
# Daily at 04:30 UTC (read only): fails if either app has no volume snapshot in the last 36 h.
# Manual actions:
#   status        list volume snapshots + app backups (read only)
#   backup-now    write today's app backup now (and its encrypted off-site copy when configured)
#   snapshot-now  take a volume snapshot now
#   verify        open a backup copy read only: integrity check + row counts (restore drill, changes nothing)
#   retention     set volume snapshot retention to `days` (1-60)
#   restore       put backup `file` back: stages it, restarts the machine, current DB kept as backups/pre-restore-*.db.
#                 Needs `confirm` = the Fly app name. Production only with the owner's explicit OK.
#   offsite-setup create the Tigris bucket <app>-backups-<time> (sets its secrets on the app) + BACKUP_KEY from the
#                 GitHub secret BACKUP_KEY (#313). The API then uploads an encrypted copy after each daily backup.
#   member-restore  one member's data back from backup `file` (support request, #315): `email`; dry run unless
#                 `apply`; `overwrite` also replaces rows that changed since; `profile` puts back the training profile.
#                 Never touches other members; deleted accounts are not restored.
#   member-delete delete a member's account on email request (#315): `email`; dry run lists their rows unless
#                 `confirm` = the same email. Same as Account → Delete account (Apple revoked, email sent).
#   offsite-rotate  new Tigris keys: destroys and recreates the bucket (copies refill from the next daily backup)
#   offsite-list  list encrypted copies in the bucket
#   offsite-fetch download + decrypt copy for `file` (a day, YYYY-MM-DD) into /data/backups, then use verify/restore
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target'
        type: choice
        options: [staging, production]
        default: staging
      action:
        description: 'What to do'
        type: choice
        options: [status, backup-now, snapshot-now, verify, retention, restore, member-restore, member-delete, offsite-setup, offsite-rotate, offsite-list, offsite-fetch]
        default: status
      file:
        description: 'verify / restore: backup file, e.g. app-2026-10-14.db'
        required: false
        default: ''
      days:
        description: 'retention: days to keep volume snapshots'
        required: false
        default: '14'
      confirm:
        description: 'restore: type the Fly app name · member-delete: type the member email'
        required: false
        default: ''
      email:
        description: 'member-restore: member email'
        required: false
        default: ''
      apply:
        description: 'member-restore: write (otherwise dry run)'
        type: boolean
        default: false
      overwrite:
        description: 'member-restore: also replace rows changed since the backup'
        type: boolean
        default: false
      profile:
        description: 'member-restore: also put back the training profile'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fly-backups-${{ inputs.environment || 'scheduled' }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ matrix.environment == 'production' && 'monkeyworkout-prod' || 'monkeyworkout-staging' }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Newest volume snapshot younger than 36 h
        run: |
          vol=$(flyctl volumes list -a "$FLY_APP" --json | jq -r '.[0].id')
          snaps=$(flyctl volumes snapshots list "$vol" --json)
          newest=$(echo "$snaps" | jq -r '[.[] | (.created_at // .CreatedAt)] | sort | last // empty')
          echo "$FLY_APP volume $vol: $(echo "$snaps" | jq length) snapshots, newest $newest" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$newest" ] || { echo "::error::$FLY_APP has no volume snapshots"; exit 1; }
          age=$(( $(date +%s) - $(date -d "$newest" +%s) ))
          [ "$age" -lt 129600 ] || { echo "::error::$FLY_APP newest volume snapshot is $((age / 3600)) h old"; exit 1; }

  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ inputs.environment == 'production' && 'monkeyworkout-prod' || 'monkeyworkout-staging' }}
      HOST: ${{ inputs.environment == 'production' && 'workout.monkeygrade.cloud' || 'workout-staging.monkeygrade.cloud' }}
      ACTION: ${{ inputs.action }}
      FILE: ${{ inputs.file }}
      DAYS: ${{ inputs.days }}
      CONFIRM: ${{ inputs.confirm }}
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      EMAIL: ${{ inputs.email }}
      APPLY: ${{ inputs.apply }}
      OVERWRITE: ${{ inputs.overwrite }}
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check inputs
        run: |
          case "$ACTION" in
            offsite-fetch) echo "$FILE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::file must be a day, YYYY-MM-DD"; exit 1; } ;;
            offsite-setup|offsite-rotate) [ -n "$BACKUP_KEY" ] && [ ${#BACKUP_KEY} -ge 24 ] || { echo "::error::add GitHub secret BACKUP_KEY (24+ chars, also keep it in your password manager)"; exit 1; } ;;
            member-restore)
              echo "$FILE" | grep -Eq '^app-[0-9]{4}-[0-9]{2}-[0-9]{2}\.db$' || { echo "::error::file must look like app-YYYY-MM-DD.db"; exit 1; }
              echo "$EMAIL" | grep -Eq '^[^ @]+@[^ @]+$' || { echo "::error::email required"; exit 1; } ;;
            member-delete)
              echo "$EMAIL" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+$' || { echo "::error::email required"; exit 1; }
              [ -z "$CONFIRM" ] || echo "$CONFIRM" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+$' || { echo "::error::confirm must be the email"; exit 1; } ;;
            verify|restore) echo "$FILE" | grep -Eq '^app-[0-9]{4}-[0-9]{2}-[0-9]{2}\.db$' || { echo "::error::file must look like app-YYYY-MM-DD.db"; exit 1; } ;;
            retention) echo "$DAYS" | grep -Eq '^[0-9]+$' && [ "$DAYS" -ge 1 ] && [ "$DAYS" -le 60 ] || { echo "::error::days must be 1-60"; exit 1; } ;;
          esac
          if [ "$ACTION" = restore ] && [ "$CONFIRM" != "$FLY_APP" ]; then echo "::error::confirm must be $FLY_APP"; exit 1; fi
      - name: Volume
        id: vol
        run: echo "id=$(flyctl volumes list -a "$FLY_APP" --json | jq -r '.[0].id')" >> "$GITHUB_OUTPUT"
      - name: Wake machine
        if: inputs.action != 'retention' && inputs.action != 'snapshot-now' && inputs.action != 'offsite-setup' && inputs.action != 'offsite-rotate'
        run: curl -fsS --retry 5 --retry-delay 3 "https://$HOST/healthz" >/dev/null
      - name: Run
        env:
          VOL: ${{ steps.vol.outputs.id }}
        run: |
          admin() { flyctl ssh console -a "$FLY_APP" -C "su -p -s /bin/sh node -c 'node --disable-warning=ExperimentalWarning /app/src/admin/backup.ts $*'"; }
          case "$ACTION" in
            status)
              flyctl volumes list -a "$FLY_APP"
              echo "--- volume snapshots"; flyctl volumes snapshots list "$VOL"
              echo "--- app backups"; admin list ;;
            backup-now) admin now ;;
            snapshot-now) flyctl volumes snapshots create "$VOL" ;;
            verify) admin verify "$FILE" ;;
            retention) flyctl volumes update "$VOL" -a "$FLY_APP" --snapshot-retention "$DAYS"; flyctl volumes show "$VOL" -a "$FLY_APP" ;;
            restore)
              admin stage-restore "$FILE"
              flyctl machine restart -a "$FLY_APP" "$(flyctl machines list -a "$FLY_APP" --json | jq -r '.[0].id')"
              curl -fsS --retry 10 --retry-delay 3 "https://$HOST/healthz"
              admin list ;;
            offsite-setup|offsite-rotate)
              have=$(flyctl secrets list -a "$FLY_APP" --json | jq -r '.[] | (.Name // .name)')
              buckets=$(flyctl storage list 2>/dev/null | grep -oE "$FLY_APP-backups[A-Za-z0-9-]*" | sort -u || true)
              echo "buckets: ${buckets:-none}"
              # offsite-rotate: new bucket keys. Destroys this app's backup buckets (copies refill from the next
              # daily backup) and creates a new one under a fresh name (names stay reserved after a destroy).
              if [ "$ACTION" = offsite-rotate ]; then
                for b in $buckets; do flyctl storage destroy "$b" -y; done
                have=""
              fi
              # `storage create` prints the new keys: never let them reach the (public) log.
              if echo "$have" | grep -qx BUCKET_NAME && [ -n "$buckets" ]; then echo "bucket exists"
              else
                name="$FLY_APP-backups-$(date -u +%Y%m%d%H%M)"
                if flyctl storage create -a "$FLY_APP" -n "$name" -y > "$RUNNER_TEMP/storage.log" 2>&1; then echo "bucket $name created, keys set as app secrets"
                else grep -vE 'tid_|tsec_|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY' "$RUNNER_TEMP/storage.log"; echo "::error::storage create failed (key lines hidden)"; rm -f "$RUNNER_TEMP/storage.log"; exit 1; fi
                rm -f "$RUNNER_TEMP/storage.log"
              fi
              # Passphrase via stdin, never printed; setting it restarts the app with the off-site copy on.
              for i in 1 2 3; do printf '%s' "$BACKUP_KEY" | flyctl secrets set -a "$FLY_APP" BACKUP_KEY=- > /dev/null && break; sleep 15; done
              flyctl secrets list -a "$FLY_APP" ;;
            member-restore)
              args=$(jq -nc --arg email "$EMAIL" --argjson apply "$APPLY" --argjson overwrite "$OVERWRITE" --argjson profile "$PROFILE" \
                '{email: $email, apply: $apply, overwrite: $overwrite, profile: $profile}' | base64 -w0)
              flyctl ssh console -a "$FLY_APP" -C "su -p -s /bin/sh node -c 'node --disable-warning=ExperimentalWarning /app/src/admin/restoreMember.ts $FILE $args'" ;;
            member-delete)
              flyctl ssh console -a "$FLY_APP" -C "su -p -s /bin/sh node -c 'node --disable-warning=ExperimentalWarning /app/src/admin/deleteMember.ts $EMAIL $CONFIRM'" ;;
            offsite-list) admin offsite-list ;;
            offsite-fetch) admin offsite-fetch "$FILE" ;;
          esac
