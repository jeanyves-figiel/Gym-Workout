name: App Store subscriptions + lifetime

# Creates the MonkeyWorkout Pro auto-renewable subscriptions (group, products, CHF prices +
# equalized territories, availability, 1-week free trial), the non-consumable "Pro Lifetime"
# (CHF 100, base CHE, all territories) and the server notification URLs
# in App Store Connect. Idempotent; default is a read-only dry run.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changes (unchecked = dry run, read-only)'
        type: boolean
        default: false
      notification_urls:
        description: 'Set App Store Server Notifications V2 URLs (prod + sandbox)'
        type: boolean
        default: true
      review_screenshot:
        description: 'Only upload the paywall App Review screenshot to every product, replacing any (from review_screenshot_ref)'
        type: boolean
        default: false
      review_screenshot_ref:
        description: 'Branch with paywall.png (UI test screenshot, scaled to 1290 x 2796)'
        default: 'screenshots/pr-1061'

permissions:
  contents: read

jobs:
  subscriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APP_ID: '6819971090'
      APPLY: ${{ inputs.apply }}
      NOTIFICATION_URLS: ${{ inputs.notification_urls }}
    steps:
      - uses: actions/checkout@v7
      - run: pip install --quiet 'pyjwt[crypto]==2.9.0' 'pillow==12.0.0'
      - name: Sync subscriptions
        run: |
          if [ -z "$ASC_KEY_ID" ]; then echo "::warning::ASC_* secrets not set; skipping."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/asc"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"; else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"; fi
          if [ "${{ inputs.review_screenshot }}" = true ]; then
            git fetch -q --depth 1 origin "${{ inputs.review_screenshot_ref }}"
            git show FETCH_HEAD:paywall.png > "$RUNNER_TEMP/paywall-src.png"
            # Apple only takes real screen sizes: scale onto a 1290 x 2796 (6.7" iPhone) canvas, edge colour fills the rest.
            python3 -c "from PIL import Image; i=Image.open('$RUNNER_TEMP/paywall-src.png').convert('RGB'); W,H=1290,2796; r=min(W/i.width,H/i.height); j=i.resize((round(i.width*r),round(i.height*r)),Image.LANCZOS); c=Image.new('RGB',(W,H),i.getpixel((0,0))); c.paste(j,((W-j.width)//2,(H-j.height)//2)); c.save('$RUNNER_TEMP/paywall.png')"
            SHOT="$RUNNER_TEMP/paywall.png" REPLACE=true python3 .github/scripts/asc_review_screenshot.py
          else
            python3 .github/scripts/asc_subscriptions.py
          fi
          rm -rf "$RUNNER_TEMP/asc"
