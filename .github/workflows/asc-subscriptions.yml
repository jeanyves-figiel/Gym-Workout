name: App Store subscriptions + lifetime

# Creates the MonkeyWorkout Pro auto-renewable subscriptions (group, products, CHF prices +
# equalized territories, availability, 1-week free trial), the non-consumable "Pro Lifetime"
# (CHF 100, base CHE, all territories) and the server notification URLs
# in App Store Connect. Idempotent; default is a read-only dry run.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changes (unchecked = dry run, read-only)'
        type: boolean
        default: false
      notification_urls:
        description: 'Set App Store Server Notifications V2 URLs (prod + sandbox)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  subscriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APP_ID: '6819971090'
      APPLY: ${{ inputs.apply }}
      NOTIFICATION_URLS: ${{ inputs.notification_urls }}
    steps:
      - uses: actions/checkout@v7
      - run: pip install --quiet 'pyjwt[crypto]==2.9.0'
      - name: Sync subscriptions
        run: |
          if [ -z "$ASC_KEY_ID" ]; then echo "::warning::ASC_* secrets not set; skipping."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/asc"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"; else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"; fi
          python3 .github/scripts/asc_subscriptions.py
          rm -rf "$RUNNER_TEMP/asc"
