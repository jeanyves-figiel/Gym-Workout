name: Free access

# Manual (#126): give or remove free MonkeyWorkout Pro access for one account, or list who has it.
# Runs backend/src/admin.ts on the Fly machine (as the app user, same database). No new secrets needed.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target'
        type: choice
        options: [staging, production]
        default: staging
      action:
        description: 'grant, revoke or list'
        type: choice
        options: [grant, revoke, list]
        default: grant
      email:
        description: 'Account email (grant / revoke)'
        required: false
      until:
        description: 'End date YYYY-MM-DD (empty = no end date)'
        required: false
      note:
        description: 'Why (letters, digits, - _ . only)'
        required: false

permissions:
  contents: read

jobs:
  access:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ inputs.environment == 'production' && 'monkeyworkout-prod' || 'monkeyworkout-staging' }}
      HOST: ${{ inputs.environment == 'production' && 'workout.monkeygrade.cloud' || 'workout-staging.monkeygrade.cloud' }}
      ACTION: ${{ inputs.action }}
      EMAIL: ${{ inputs.email }}
      UNTIL: ${{ inputs.until }}
      NOTE: ${{ inputs.note }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate inputs
        run: |
          if [ "$ACTION" != list ] && ! printf '%s' "$EMAIL" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then echo "::error::Valid email required"; exit 1; fi
          if [ -n "$UNTIL" ] && ! printf '%s' "$UNTIL" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then echo "::error::until must be YYYY-MM-DD"; exit 1; fi
          if [ -n "$NOTE" ] && ! printf '%s' "$NOTE" | grep -Eq '^[A-Za-z0-9._-]{1,80}$'; then echo "::error::note: letters, digits, - _ . only"; exit 1; fi
      - name: Wake the machine
        run: curl -fsS --retry 5 --retry-delay 3 "https://$HOST/healthz"
      - name: Run
        run: |
          ARGS="$ACTION"
          [ "$ACTION" != list ] && ARGS="$ARGS $EMAIL"
          [ "$ACTION" = grant ] && [ -n "$UNTIL" ] && ARGS="$ARGS --until $UNTIL"
          [ "$ACTION" = grant ] && [ -n "$NOTE" ] && ARGS="$ARGS --note $NOTE"
          # The entrypoint drops to the app user so the SQLite files keep their owner.
          flyctl ssh console -a "$FLY_APP" -C "docker-entrypoint.sh node --disable-warning=ExperimentalWarning /app/src/admin.ts $ARGS"
