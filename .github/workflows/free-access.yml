name: Free access

# Manual (#126): give or remove free MonkeyWorkout Pro access for one account, list who has it,
# or grant-all: free access until `until` for every account that exists now (early testers, at launch).
# Runs backend/src/admin.ts on the Fly machine (as the app user, same database). No new secrets needed.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target'
        type: choice
        options: [staging, production]
        default: staging
      action:
        description: 'grant, revoke, list or grant-all (every existing account, needs until)'
        type: choice
        options: [grant, revoke, list, grant-all]
        default: grant
      email:
        description: 'Account email (grant / revoke)'
        required: false
      until:
        description: 'End date YYYY-MM-DD (empty = no end date)'
        required: false
      note:
        description: 'Why (letters, digits, - _ . only)'
        required: false

permissions:
  contents: read

jobs:
  access:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ inputs.environment == 'production' && 'monkeyworkout-prod' || 'monkeyworkout-staging' }}
      HOST: ${{ inputs.environment == 'production' && 'workout.monkeygrade.cloud' || 'workout-staging.monkeygrade.cloud' }}
      ACTION: ${{ inputs.action }}
      UNTIL: ${{ inputs.until }}
      NOTE: ${{ inputs.note }}
    steps:
      # The repo is public: the member email is read from the event file and masked before any step prints its env (#432).
      - name: Mask member email
        run: |
          email=$(jq -r '.inputs.email // ""' "$GITHUB_EVENT_PATH" | tr -d '\r\n')
          [ -n "$email" ] && echo "::add-mask::$email"
          echo "EMAIL=$email" >> "$GITHUB_ENV"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master, pinned (#432)
      - name: Validate inputs
        run: |
          if [ "$ACTION" = grant-all ] && [ -z "$UNTIL" ]; then echo "::error::grant-all needs until"; exit 1; fi
          if [ "$ACTION" != list ] && [ "$ACTION" != grant-all ] && ! printf '%s' "$EMAIL" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then echo "::error::Valid email required"; exit 1; fi
          if [ -n "$UNTIL" ] && ! printf '%s' "$UNTIL" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then echo "::error::until must be YYYY-MM-DD"; exit 1; fi
          if [ -n "$NOTE" ] && ! printf '%s' "$NOTE" | grep -Eq '^[A-Za-z0-9._-]{1,80}$'; then echo "::error::note: letters, digits, - _ . only"; exit 1; fi
      - name: Wake the machine
        run: curl -fsS --retry 5 --retry-delay 3 "https://$HOST/healthz"
      - name: Run
        run: |
          ARGS="$ACTION"
          if [ "$ACTION" = grant ] || [ "$ACTION" = revoke ]; then ARGS="$ARGS $EMAIL"; fi
          if [ "$ACTION" = grant ] || [ "$ACTION" = grant-all ]; then
            if [ -n "$UNTIL" ]; then ARGS="$ARGS --until $UNTIL"; fi
            if [ -n "$NOTE" ]; then ARGS="$ARGS --note $NOTE"; fi
          fi
          # The entrypoint drops to the app user so the SQLite files keep their owner.
          flyctl ssh console -a "$FLY_APP" -C "docker-entrypoint.sh node --disable-warning=ExperimentalWarning /app/src/admin.ts $ARGS"
