name: Fly logs

# Manual: print recent API logs from Fly (no local CLI needed). Error lines only by default.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target'
        type: choice
        options: [staging, production]
        default: staging
      filter:
        description: 'grep -E pattern (empty = all lines)'
        required: false
        default: '"level":(40|50|60)|Error|error'

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ inputs.environment == 'production' && 'monkeyworkout-prod' || 'monkeyworkout-staging' }}
      FILTER: ${{ inputs.filter }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Recent logs
        run: |
          flyctl logs -a "$FLY_APP" --no-tail > logs.txt || true
          if [ -n "$FILTER" ]; then grep -E "$FILTER" logs.txt | tail -n 200 || echo "(no matching lines)"; else tail -n 300 logs.txt; fi
