name: Deploy staging

# Trunk: every squash-merge to main builds one immutable API image and deploys it to staging.
on:
  push:
    branches: [main]

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: monkeyworkout-staging
      SRC: ${{ needs.image.outputs.image }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Fly token
        id: gate
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN not set — image $SRC published, no deploy triggered."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure flyctl
        if: steps.gate.outputs.skip != 'true'
        # setup-flyctl occasionally finishes without flyctl on PATH (staging deploy run 38084710625); fall back to the installer.
        run: |
          command -v flyctl && exit 0
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same image digest CI built; mirrored to Fly's registry so GHCR can stay private.
      - name: Mirror image to Fly registry
        if: steps.gate.outputs.skip != 'true'
        run: |
          flyctl auth docker
          DST="registry.fly.io/$FLY_APP:sha-$GITHUB_SHA"
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
          echo "DST=$DST" >> "$GITHUB_ENV"
      - name: Deploy to Fly staging
        if: steps.gate.outputs.skip != 'true'
        run: |
          flyctl deploy --config backend/fly.staging.toml --app "$FLY_APP" --image "$DST"
          echo "Deployed \`$SRC\` to $FLY_APP" >> "$GITHUB_STEP_SUMMARY"
