name: Deploy staging

# Trunk: every squash-merge to main builds one immutable image and deploys it to staging.
on:
  push:
    branches: [main]

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Trigger staging deploy
        env:
          HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
          IMAGE: ${{ needs.image.outputs.image }}:sha-${{ github.sha }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::STAGING_DEPLOY_HOOK not set — image $IMAGE published, no deploy triggered."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -H 'Content-Type: application/json' \
            -d "{\"image\":\"$IMAGE\",\"sha\":\"$GITHUB_SHA\",\"env\":\"staging\"}"
          echo "Deployed $IMAGE to staging" >> "$GITHUB_STEP_SUMMARY"
