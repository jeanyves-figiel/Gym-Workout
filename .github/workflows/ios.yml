name: iOS

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: GymCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift test --package-path ios/Packages/GymCore
      - run: swift test --package-path ios/Packages/LiftSensor

  app:
    name: App build (simulator)
    # xcode-27 runner, Xcode 27.1: iOS 27.1 SDK / iPhone Duo + iPad simulators (#120, #158).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select newest Xcode
        run: |
          # Xcode 27.1: iOS 27.1 SDK, full-screen iPhone Duo (#158). Xcode_27.2.app is a beta symlink.
          XC=/Applications/Xcode_27.1.app
          [ -d "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - name: Build Debug + Staging
        run: |
          set -o pipefail
          for cfg in Debug Staging; do
            xcodebuild build \
              -project ios/MonkeyWorkout.xcodeproj \
              -scheme MonkeyWorkout \
              -configuration "$cfg" \
              -destination 'generic/platform=iOS Simulator' \
              -skipPackagePluginValidation \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
              || { grep -E 'error:' build.log | sort -u; tail -n 50 build.log; exit 1; }
            tail -n 50 build.log
          done
      # Device-only code (RoomPlan, #417) never compiles for the simulator; unsigned device build of the
      # TestFlight scheme catches it, and SDK breaks on the TestFlight Xcode, before an archive run (#158).
      - name: Build Staging for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project ios/MonkeyWorkout.xcodeproj -scheme "MonkeyWorkout Staging" -configuration Staging \
            -destination 'generic/platform=iOS' -skipPackagePluginValidation -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO > device.log 2>&1 \
            || { grep -E 'error:' device.log | sort -u; tail -n 50 device.log; exit 1; }
          tail -n 5 device.log
      # Complications (#190): the widget extension must sit in the Watch app's PlugIns with the WidgetKit extension point.
      - name: Check Watch complications are embedded
        run: |
          W=build/Build/Products/Staging-iphonesimulator/MonkeyWorkout.app/Watch/MonkeyWorkoutWatch.app
          find "$W" -maxdepth 3 -name '*.appex' -print
          X="$W/PlugIns/MonkeyWorkoutWatchComplications.appex"
          [ -d "$X" ] || { echo "::error::MonkeyWorkoutWatchComplications.appex missing from the Watch app"; exit 1; }
          plutil -p "$X/Info.plist" | grep -E 'CFBundleIdentifier|NSExtensionPointIdentifier|MWAppGroup|MinimumOSVersion'
          plutil -p "$W/Info.plist" | grep -E 'CFBundleIdentifier|WKApplication|WKCompanionAppBundleIdentifier|MinimumOSVersion'
      # Home Screen widgets (#297): one extension (Live Activity + widgets) in the app's PlugIns, both on the App Group.
      - name: Check Home Screen widgets are embedded
        run: |
          A=build/Build/Products/Staging-iphonesimulator/MonkeyWorkout.app
          X="$A/PlugIns/MonkeyWorkoutWidgets.appex"
          [ -d "$X" ] || { echo "::error::MonkeyWorkoutWidgets.appex missing from the app"; exit 1; }
          plutil -p "$X/Info.plist" | grep -q MWAppGroup || { echo "::error::MWAppGroup missing from the widget extension Info.plist"; exit 1; }
          plutil -p "$A/Info.plist" | grep -q MWAppGroup || { echo "::error::MWAppGroup missing from the app Info.plist"; exit 1; }
          plutil -p "$A/Info.plist" | grep -A4 CFBundleURLTypes
      # Complications (#190, #235): install on a Watch simulator; fail if the extension crashes when the face gallery loads it.
      - name: Check Watch complications register (simulator)
        run: |
          APP=build/Build/Products/Staging-watchsimulator/MonkeyWorkoutWatch.app
          [ -d "$APP" ] || APP=build/Build/Products/Debug-watchsimulator/MonkeyWorkoutWatch.app
          [ -d "$APP" ] || { echo "::warning::No Watch simulator build"; ls build/Build/Products; exit 0; }
          WATCH=$(xcrun simctl list devices available | grep -m1 -E "Apple Watch" | grep -oE '[0-9A-F-]{36}')
          [ -n "$WATCH" ] || { echo "::warning::No Apple Watch simulator"; exit 0; }
          xcrun simctl boot "$WATCH" || true
          xcrun simctl bootstatus "$WATCH" -b || true
          START=$(date '+%Y-%m-%d %H:%M:%S')
          xcrun simctl install "$WATCH" "$APP"
          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl launch "$WATCH" "$ID" || true
          sleep 40
          xcrun simctl spawn "$WATCH" log show --start "$START" --style compact \
            --predicate 'process == "chronod" OR process CONTAINS "MonkeyWorkoutWatchComplications" OR eventMessage CONTAINS "MonkeyWorkoutWatchComplications"' \
            > chrono.log 2>&1 || true
          echo "--- extension / chronod lines mentioning MonkeyWorkout"
          grep -i 'monkeyworkout' chrono.log | cut -c1-400 | head -n 80 || true
          echo "--- errors"
          grep -iE 'error|fail|crash|invalid|unable' chrono.log | grep -i -E 'monkey|complication|descriptor' | cut -c1-400 | head -n 40 || true
          echo "--- crash reports"
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i monkey | head || true
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*MonkeyWorkoutWatchComplications* 2>/dev/null | head -n 1); do head -c 6000 "$f"; done
          xcrun simctl shutdown "$WATCH" || true
          if grep -q 'MonkeyWorkoutWatchComplications.*Fatal error' chrono.log || ls ~/Library/Logs/DiagnosticReports/*MonkeyWorkoutWatchComplications* >/dev/null 2>&1; then
            echo "::error::Complications extension crashed on the Watch simulator: no complication would show on watch faces"
            exit 1
          fi

  ui-tests:
    name: UI tests (demo mode)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Select newest Xcode
        run: |
          # Xcode 27.1: iOS 27.1 SDK, full-screen iPhone Duo (#158). Xcode_27.2.app is a beta symlink.
          XC=/Applications/Xcode_27.1.app
          [ -d "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      # Your gym edits stay after SAVE (#271); Start workout fits on Train (#337); landscape player (#362).
      - name: Run UI tests
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[5-8] Pro \(" | grep -oE '[0-9A-F-]{36}')
          echo "device=$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcodebuild test -project ios/MonkeyWorkout.xcodeproj -scheme MonkeyWorkout -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build -skipPackagePluginValidation \
            -only-testing:MonkeyWorkoutUITests CODE_SIGNING_ALLOWED=NO > test.log 2>&1 \
            || { grep -E 'error:|failed|XCTAssert' test.log | sort -u | head -n 60; tail -n 80 test.log; exit 1; }
          grep -E 'Test Case|Executed' test.log | tail -n 20

  screenshots:
    name: Screenshots (demo mode)
    needs: app
    # 100: the programme (#255) and security (#257) screens pushed the run past 60 minutes;
    # 150: iPhone + iPad + Watch captures passed 100 on busy runners (#443).
    timeout-minutes: 150
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Select newest Xcode
        run: |
          # Xcode 27.1: iOS 27.1 SDK, full-screen iPhone Duo (#158). Xcode_27.2.app is a beta symlink.
          XC=/Applications/Xcode_27.1.app
          [ -d "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - name: Boot simulators during the build
        run: |
          # Cold boots took ~10 min of the job (iPad + Watch); start them now so they overlap the build.
          for pat in "iPhone 1[5-8] Pro \(" "iPad Pro 13-inch" "Apple Watch"; do
            ID=$(xcrun simctl list devices available | grep -m1 -E "$pat" | grep -oE '[0-9A-F-]{36}' || true)
            if [ -n "$ID" ]; then xcrun simctl boot "$ID" || true; else echo "::warning::No simulator for $pat"; fi
          done
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build -project ios/MonkeyWorkout.xcodeproj -scheme MonkeyWorkout -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tail -n 5
      - name: Capture screens
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[5-8] Pro \(" | grep -oE '[0-9A-F-]{36}')
          echo "device=$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/MonkeyWorkout.app
          mkdir -p shots
          for s in welcome signin signup verify onboarding onboarding-climbing onboarding-figure week train-edit train-gallery train-customise train-data train-climber train-minimal train-looks climb climb-settings monkeygrade example session session-bento session-muscles session-customise swap workout-style player player-rest tv-player cast-sheet player-timed player-logged player-next player-coach player-record coach-settings watch-options watch-lift lift-practice workout-flow finish-early player-fitted player-map explore explore-list explore-volume explore-female explore-3d explore-3d-back explore-3d-side explore-workouts muscle muscle-female exercise pr pr-attempt pr-result technique progress progress-flipped progress-records progress-empty progress-edit progress-sports history history-page body body-talk account paywall pro pro-offer pro-gate account-profile account-password account-email account-security account-reauth account-2step account-recovery account-passkeys signin-2step readiness cycle picker library library-plan builder muscle-picker generate generated coach-chat coach-chat-empty ask-coach calendar day move add-workout add-workout-quick whats-new whats-new-history away gyms own-gym variety variation community community-join community-post community-story community-post-detail community-plan community-share-plan community-tip community-share community-profile community-members notifications reschedule profile profile-gym profile-gym-add profile-goal profile-goal-focus day-focus profile-method profile-flow flow-session flow-builder flow-picks equipment equipment-zones equipment-by-zone floor-plan session-zones swap-zones player-zones gym-setup gym-swipe gym-result not-here measurements measurement-log measurement-detail measurement-howto measurement-guide watch-home home-widgets home-widgets-custom home-widgets-gradient home-widgets-coach home-widgets-data game-week-coach game-week-deck game-week-rings game-session-coach game-session-deck game-session-rings game-done-coach game-done-deck game-done-rings game-progress-coach game-progress-deck game-progress-rings game-quest-deck game-ladder game-levelup game-levelup-legend game-level-row explore-programmes explore-routines daily-pick daily-offer routine-builder programme programme-running train-programme programme-test progress-programmes profile-programme calendar-programme programme-finished programme-length programme-grid programme-grid-running programme-mine programme-builder programme-builder-week snow-ready hyrox-ready train-missed missed-catchup missed-log calendar-missed train-day-picked train-rest-day train-sport-day around-sport train-past-day past-day-log train-skipped undo-bar edit-exercises session-edited flow-warmup flow-cooldown quick-flow taste train-taste focus-sheet swap-day player-superset player-superset-fix player-split player-setup machine-setup exercise-setups position position-mistake position-press form-live form-ghost form-report form-coach wall-session climb-live explore-climbing wall-hangboard exercise-climbing explore-machines explore-machine-chips explore-gym-chip explore-gym machine report report-shake report-error report-sent your-week-sports add-sport plan-sport calendar-trip day-trip fresh-start fuel fuel-log fuel-snap fuel-recipes recipe cook-mode fuel-pantry meal-plan groceries fuel-week fuel-learn fuel-water fuel-setup fuel-setup-card fuel-plate fuel-snap-plate share-recipe fuel-supplements fuel-stack train-smart block-tweak auto-tune growth-path coach-memory lift-lab lift-focus lift-focus-setup set-style train-comeback remote-banner remote-required remote-paused train-run train-hybrid run-session run-start run-goal zone-week onboarding-gym onboarding-machines onboarding-map onboarding-plan onboarding-tour app-tour train-setup onboarding-hub social-invite story-sheet challenge challenge-suggest how-it-works how-it-works-fuel; do
            xcrun simctl launch --terminate-running-process "$DEVICE" Com.app.MonkeyWorkout.dev -demo -demoScreen "$s"
            sleep 6
            case "$s" in explore-3d*) sleep 10 ;; esac  # 3D figure is built after launch (Debug build)
            # A blank or still-loading screen is a tiny PNG (#825): give the busy Debug simulator up to two more tries.
            for try in 1 2 3; do
              xcrun simctl io "$DEVICE" screenshot "shots/$s.png"
              sips -Z 800 "shots/$s.png" >/dev/null
              [ "$(stat -f%z "shots/$s.png")" -gt 25000 ] && break
              [ "$try" = 3 ] && echo "$s" >> blank.txt || sleep 6
            done
          done
          if [ -s blank.txt ]; then echo "::warning::Blank screens: $(tr '\n' ' ' < blank.txt)"; { echo "Blank after retries:"; cat blank.txt; } >> "$GITHUB_STEP_SUMMARY"; fi
          xcrun simctl shutdown "$DEVICE" || true
          ls -la shots
      - name: Capture iPad screens
        run: |
          # Wide layout check (#120): readable column, sidebar-adaptable tabs.
          xcrun simctl list devicetypes | grep -iE "ipad|duo|fold" || true
          IPAD=$(xcrun simctl list devices available | grep -m1 -E "iPad Pro 13-inch" | grep -oE '[0-9A-F-]{36}')
          echo "ipad=$IPAD"
          [ -n "$IPAD" ] || { echo "::warning::No iPad Pro 13-inch simulator"; exit 0; }
          xcrun simctl boot "$IPAD" || true
          xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl status_bar "$IPAD" override --time 9:41 --batteryLevel 100 || true
          xcrun simctl install "$IPAD" build/Build/Products/Debug-iphonesimulator/MonkeyWorkout.app
          for s in welcome week session player explore muscle progress community account calendar; do
            xcrun simctl launch --terminate-running-process "$IPAD" Com.app.MonkeyWorkout.dev -demo -demoScreen "$s"
            sleep 6
            for try in 1 2 3; do
              xcrun simctl io "$IPAD" screenshot "shots/ipad-$s.png"
              sips -Z 800 "shots/ipad-$s.png" >/dev/null
              [ "$(stat -f%z "shots/ipad-$s.png")" -gt 25000 ] && break
              [ "$try" = 3 ] || sleep 6
            done
          done
          # iPhone Duo postures (#598): the sim has no hinge, so force each one; the iPad stands in for the Duo inner screen.
          for pose in flex book tent; do
            xcrun simctl launch --terminate-running-process "$IPAD" Com.app.MonkeyWorkout.dev -demo -demoScreen player -duoPosture "$pose"
            sleep 8
            xcrun simctl io "$IPAD" screenshot "shots/ipad-player-$pose.png"
            sips -Z 800 "shots/ipad-player-$pose.png" >/dev/null
          done
      - name: Capture Watch home styles
        run: |
          # Watch home styles (#219), best effort: needs a watchOS simulator runtime on the runner.
          APP=build/Build/Products/Debug-watchsimulator/MonkeyWorkoutWatch.app
          [ -d "$APP" ] || { echo "::warning::No Watch simulator build"; exit 0; }
          WATCH=$(xcrun simctl list devices available | grep -m1 -E "Apple Watch" | grep -oE '[0-9A-F-]{36}')
          [ -n "$WATCH" ] || { echo "::warning::No Apple Watch simulator"; exit 0; }
          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl boot "$WATCH" || true
          xcrun simctl bootstatus "$WATCH" -b || true
          xcrun simctl install "$WATCH" "$APP" || { echo "::warning::Watch install failed"; exit 0; }
          for s in coach deck rings; do
            for v in home list missed detail progress summary levelup mirror phone-start pro lift lift-stop lift-log lift-confirm practice strap testrep timers boxing swings swim swim-sets open-water; do
              if [ "$v" = home ]; then EXTRA=""; else EXTRA="-watchScreen $v"; fi
              xcrun simctl launch --terminate-running-process "$WATCH" "$ID" -demo -homeStyle "$s" $EXTRA || continue
              sleep 5
              xcrun simctl io "$WATCH" screenshot "shots/watch-$s-$v.png" || true
            done
          done
          xcrun simctl shutdown "$WATCH" || true
      - name: Publish to screenshots branch
        env:
          TOKEN: ${{ github.token }}
          BRANCH: screenshots/pr-${{ github.event.number }}
        run: |
          cd shots
          git init -q -b shots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          echo "Screenshots on branch \`${BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: shots
