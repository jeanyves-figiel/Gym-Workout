name: iOS

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: GymCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path ios/Packages/GymCore

  app:
    name: App build (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - name: Build Debug + Staging
        run: |
          set -o pipefail
          for cfg in Debug Staging; do
            xcodebuild build \
              -project ios/MonkeyWorkout.xcodeproj \
              -scheme MonkeyWorkout \
              -configuration "$cfg" \
              -destination 'generic/platform=iOS Simulator' \
              -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
              || { grep -E 'error:' build.log | sort -u; tail -n 50 build.log; exit 1; }
            tail -n 50 build.log
          done

  screenshots:
    name: Screenshots (demo mode)
    needs: app
    timeout-minutes: 25
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build -project ios/MonkeyWorkout.xcodeproj -scheme MonkeyWorkout -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tail -n 5
      - name: Capture screens
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[5-7] Pro \(" | grep -oE '[0-9A-F-]{36}')
          echo "device=$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/MonkeyWorkout.app
          mkdir -p shots
          for s in welcome onboarding onboarding-climbing week climb climb-settings monkeygrade example session player player-rest explore muscle exercise pr pr-attempt pr-result technique progress progress-empty history body account account-password account-email readiness cycle picker library library-plan builder calendar away gyms variety community community-join community-share community-profile notifications reschedule; do
            xcrun simctl launch --terminate-running-process "$DEVICE" Com.app.MonkeyWorkout.dev -demo -demoScreen "$s"
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "shots/$s.png"
            sips -Z 800 "shots/$s.png" >/dev/null
          done
          ls -la shots
      - name: Publish to screenshots branch
        env:
          TOKEN: ${{ github.token }}
          BRANCH: screenshots/pr-${{ github.event.number }}
        run: |
          cd shots
          git init -q -b shots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          echo "Screenshots on branch \`${BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
