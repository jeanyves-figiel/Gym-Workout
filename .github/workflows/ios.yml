name: iOS

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: GymCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path ios/Packages/GymCore

  app:
    name: App build (simulator)
    # iOS 27 SDK / iPhone Duo + iPad simulators (#120).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - name: Build Debug + Staging
        run: |
          set -o pipefail
          for cfg in Debug Staging; do
            xcodebuild build \
              -project ios/MonkeyWorkout.xcodeproj \
              -scheme MonkeyWorkout \
              -configuration "$cfg" \
              -destination 'generic/platform=iOS Simulator' \
              -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
              || { grep -E 'error:' build.log | sort -u; tail -n 50 build.log; exit 1; }
            tail -n 50 build.log
          done

  screenshots:
    name: Screenshots (demo mode)
    needs: app
    timeout-minutes: 45
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build -project ios/MonkeyWorkout.xcodeproj -scheme MonkeyWorkout -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tail -n 5
      - name: Capture screens
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[5-7] Pro \(" | grep -oE '[0-9A-F-]{36}')
          echo "device=$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/MonkeyWorkout.app
          mkdir -p shots
          for s in welcome signin signup verify onboarding onboarding-climbing onboarding-figure week climb climb-settings monkeygrade example session swap workout-style player player-rest player-timed player-logged explore explore-list explore-volume explore-female explore-workouts muscle muscle-female exercise pr pr-attempt pr-result technique progress progress-empty history body account paywall pro pro-offer pro-gate account-profile account-password account-email readiness cycle picker library library-plan builder muscle-picker generate generated calendar day move add-workout add-workout-quick whats-new away gyms variety variation community community-join community-share community-profile community-members notifications reschedule profile profile-gym profile-goal profile-goal-focus day-focus profile-method profile-flow flow-session flow-builder flow-picks equipment gym-setup gym-swipe gym-result not-here measurements measurement-log measurement-detail measurement-howto measurement-guide; do
            xcrun simctl launch --terminate-running-process "$DEVICE" Com.app.MonkeyWorkout.dev -demo -demoScreen "$s"
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "shots/$s.png"
            sips -Z 800 "shots/$s.png" >/dev/null
          done
          xcrun simctl shutdown "$DEVICE" || true
          ls -la shots
      - name: Capture iPad screens
        run: |
          # Wide layout check (#120): readable column, sidebar-adaptable tabs.
          xcrun simctl list devicetypes | grep -iE "ipad|duo|fold" || true
          IPAD=$(xcrun simctl list devices available | grep -m1 -E "iPad Pro 13-inch" | grep -oE '[0-9A-F-]{36}')
          echo "ipad=$IPAD"
          [ -n "$IPAD" ] || { echo "::warning::No iPad Pro 13-inch simulator"; exit 0; }
          xcrun simctl boot "$IPAD"
          xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl status_bar "$IPAD" override --time 9:41 --batteryLevel 100 || true
          xcrun simctl install "$IPAD" build/Build/Products/Debug-iphonesimulator/MonkeyWorkout.app
          for s in welcome week session player explore muscle progress community account calendar; do
            xcrun simctl launch --terminate-running-process "$IPAD" Com.app.MonkeyWorkout.dev -demo -demoScreen "$s"
            sleep 6
            xcrun simctl io "$IPAD" screenshot "shots/ipad-$s.png"
            sips -Z 800 "shots/ipad-$s.png" >/dev/null
          done
      - name: Publish to screenshots branch
        env:
          TOKEN: ${{ github.token }}
          BRANCH: screenshots/pr-${{ github.event.number }}
        run: |
          cd shots
          git init -q -b shots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          echo "Screenshots on branch \`${BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
