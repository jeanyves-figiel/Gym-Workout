# Fly.io production app (#3). Deployed only by the manual .github/workflows/promote.yml (same image as staging).
# Public host: https://workout.monkeygrade.cloud (CNAME → monkeyworkout-prod.fly.dev).
# App, volume, secrets (JWT_SECRET, CODE_PEPPER, MAIL_TRANSPORT=console) and cert: .github/workflows/fly-setup.yml (environment: production).
app = 'monkeyworkout-prod'
primary_region = 'fra'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  DB_PATH = '/data/app.db'

# SQLite lives on this volume → exactly one machine.
[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
