name: MonkeyWorkout
options:
  bundleIdPrefix: com.app
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Staging: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig
packages:
  GymCore:
    path: Packages/GymCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    # App Store Connect: MonkeyWorkout · SKU Monkeyworkout · Apple ID 6819971090
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: U7VAR53G86
    CODE_SIGN_STYLE: Automatic
targets:
  MonkeyWorkout:
    type: application
    platform: iOS
    sources:
      - path: MonkeyWorkout
        excludes: [Resources/PrivacyInfo.xcprivacy]
      - path: MonkeyWorkout/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
      - path: WatchShared
    dependencies:
      - target: MonkeyWorkoutWidgets
        embed: true
      - target: MonkeyWorkoutWatch
      - package: GymCore
        product: WorkoutEngine
      - package: GymCore
        product: APIClient
    entitlements:
      path: MonkeyWorkout/MonkeyWorkout.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Remote push (#69). Archive/export for TestFlight/App Store switches it to production.
        aps-environment: development
    info:
      path: MonkeyWorkout/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # iPhone (and the folded iPhone Duo) stay portrait; iPad needs every orientation for multitasking (#120).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Unlock MonkeyWorkout with Face ID.
        NSCameraUsageDescription: Take a photo of a machine for your own exercises.
        NSHealthShareUsageDescription: Reads weight, height, body fat, lean body mass, waist circumference, age, sex, resting heart rate, HRV, VO2max, sleep, heart rate during sessions and climbing workouts to estimate calories and starting weights, show readiness and track progress.
        NSLocationWhenInUseUsageDescription: Finds gyms near you. Your location is only used for the search and never leaves this device except to Apple Maps.
        NSHealthUpdateUsageDescription: Saves your gym sessions as workouts, and the weight, height, body fat, lean mass and waist you enter, to Apple Health.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: MonkeyWorkout
        # iPhone + iPad (#120).
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Rank app icons the member can switch to (#242).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Iron AppIcon-Titan AppIcon-Legend
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  # Live Activity (lock screen + Dynamic Island) of the workout player (#55).
  MonkeyWorkoutWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MonkeyWorkoutWidgets
      - path: Shared
    info:
      path: MonkeyWorkoutWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).LiveActivity
        PRODUCT_NAME: MonkeyWorkoutWidgets
        # Matches the app; Live Activities only show on iPhone (ActivityKit is off on iPad).
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  # Apple Watch companion (#56), embedded in the iOS app.
  MonkeyWorkoutWatch:
    type: application
    platform: watchOS
    sources:
      - path: MonkeyWorkoutWatch
        excludes: [MonkeyWorkoutWatch.entitlements]
      - path: WatchShared
      - path: MonkeyWorkoutWatchComplications/SharedSnapshot.swift
    dependencies:
      - target: MonkeyWorkoutWatchComplications
        embed: true
    entitlements:
      path: MonkeyWorkoutWatch/MonkeyWorkoutWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: MonkeyWorkoutWatch/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        WKBackgroundModes: [workout-processing]
        MWAppGroup: $(APP_GROUP)
        NSHealthShareUsageDescription: Reads heart rate and active energy during your workouts.
        NSHealthUpdateUsageDescription: Saves your gym sessions as workouts to Apple Health.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: MonkeyWorkoutWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
  # Watch face complications (#190), embedded in the Watch app.
  MonkeyWorkoutWatchComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: MonkeyWorkoutWatchComplications
        excludes: [MonkeyWorkoutWatchComplications.entitlements]
      - path: WatchShared
    entitlements:
      path: MonkeyWorkoutWatchComplications/MonkeyWorkoutWatchComplications.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: MonkeyWorkoutWatchComplications/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MWAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp.Complications
        PRODUCT_NAME: MonkeyWorkoutWatchComplications
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
schemes:
  MonkeyWorkout:
    build:
      targets:
        MonkeyWorkout: all
    run:
      config: Debug
      # Local StoreKit testing in Xcode (#126): Pro products, CHF prices, free week. Device/TestFlight use App Store sandbox.
      storeKitConfiguration: Config/MonkeyWorkout.storekit
    archive:
      config: Release
  MonkeyWorkout Staging:
    build:
      targets:
        MonkeyWorkout: all
    run:
      config: Staging
    archive:
      config: Staging
