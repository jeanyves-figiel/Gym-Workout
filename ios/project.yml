name: GymWorkout
options:
  bundleIdPrefix: ch.figiel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Staging: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig
packages:
  GymCore:
    path: Packages/GymCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  GymWorkout:
    type: application
    platform: iOS
    sources:
      - path: GymWorkout
        excludes: [Resources/PrivacyInfo.xcprivacy]
      - path: GymWorkout/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: GymCore
        product: WorkoutEngine
      - package: GymCore
        product: APIClient
    entitlements:
      path: GymWorkout/GymWorkout.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: GymWorkout/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Unlock Gym-Workout with Face ID.
        NSHealthShareUsageDescription: Reads weight, height, age, sex, resting heart rate, HRV, VO2max, sleep, heart rate during sessions and climbing workouts to estimate calories, show readiness and track progress.
        NSHealthUpdateUsageDescription: Saves your gym sessions as workouts, and weight and height you enter, to Apple Health.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
schemes:
  GymWorkout:
    build:
      targets:
        GymWorkout: all
    run:
      config: Debug
    archive:
      config: Release
  GymWorkout Staging:
    build:
      targets:
        GymWorkout: all
    run:
      config: Staging
    archive:
      config: Staging
