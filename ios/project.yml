name: MonkeyWorkout
options:
  bundleIdPrefix: com.app
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Staging: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig
packages:
  GymCore:
    path: Packages/GymCore
  LiftSensor:
    path: Packages/LiftSensor
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    # App Store Connect: MonkeyWorkout · SKU Monkeyworkout · Apple ID 6819971090
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: U7VAR53G86
    CODE_SIGN_STYLE: Automatic
targets:
  MonkeyWorkout:
    type: application
    platform: iOS
    sources:
      - path: MonkeyWorkout
        excludes: [Resources/PrivacyInfo.xcprivacy]
      - path: MonkeyWorkout/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
      - path: WatchShared
      # Home Screen widgets (#297): snapshot, settings and faces, shared with the widget extension.
      - path: HomeWidgets
    dependencies:
      - target: MonkeyWorkoutWidgets
        embed: true
      - target: MonkeyWorkoutWatch
      - package: GymCore
        product: WorkoutEngine
      - package: GymCore
        product: APIClient
      - package: LiftSensor
    entitlements:
      path: MonkeyWorkout/MonkeyWorkout.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Passkeys (#257): the API hosts serve /.well-known/apple-app-site-association.
        com.apple.developer.associated-domains:
          - webcredentials:workout.monkeygrade.cloud
          - webcredentials:workout-staging.monkeygrade.cloud
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        # Remote push (#69). Archive/export for TestFlight/App Store switches it to production.
        aps-environment: development
        # Home Screen widgets (#297) read the app's snapshot from this container.
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: MonkeyWorkout/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # iPad needs every orientation for multitasking (#120). iPhone lists landscape for the workout player only (#362):
        # `OrientationLock` keeps every other screen portrait.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Unlock MonkeyWorkout with Face ID.
        NSCameraUsageDescription: Take photos of machines for your own exercises and scan your gym for its map.
        NSMicrophoneUsageDescription: Talk to Coach in the app and during workouts (say done, a weight, or ask a question).
        NSSpeechRecognitionUsageDescription: Turns what you say to Coach into text, on your iPhone when it can. Only the words are sent to Coach.
        NSHealthShareUsageDescription: Reads weight, height, body fat, lean body mass, waist circumference, age, sex, resting heart rate, HRV, VO2max, sleep, steps, floors climbed, heart rate during sessions and climbing workouts to estimate calories and starting weights, show readiness, count daily walking and stairs toward your level, and track progress.
        NSLocationWhenInUseUsageDescription: Finds gyms near you. Your location is only used for the search and never leaves this device except to Apple Maps.
        NSHealthUpdateUsageDescription: Saves your gym sessions as workouts, and the weight, height, body fat, lean mass and waist you enter, to Apple Health.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        MWAppGroup: $(APP_GROUP)
        # Home Screen widget taps (#297): monkeyworkout://session/<id>, monkeyworkout://progress, …
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [monkeyworkout]
        # Plain-HTTP local API for DEV only (http://localhost:7443): removed from Staging/Release builds below (#432).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    postBuildScripts:
      # After Info.plist processing (declared input), before code signing (always last for the app).
      - name: Drop local networking (Staging/Release)
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then exit 0; fi
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity:NSAllowsLocalNetworking" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" || true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: MonkeyWorkout
        # The local-networking script above edits the built Info.plist (#432).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # iPhone + iPad (#120).
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Rank app icons the member can switch to (#242).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Iron AppIcon-Titan AppIcon-Legend
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  # Live Activity (lock screen + Dynamic Island) of the workout player (#55).
  MonkeyWorkoutWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MonkeyWorkoutWidgets
        excludes: [MonkeyWorkoutWidgets.entitlements]
      - path: Shared
      # Home Screen widgets (#297); the Monkey coach look draws the Watch's monkey.
      - path: HomeWidgets
      - path: WatchShared/MonkeyFace.swift
      - path: WatchShared/GameLadder.swift
    entitlements:
      path: MonkeyWorkoutWidgets/MonkeyWorkoutWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: MonkeyWorkoutWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MWAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).LiveActivity
        PRODUCT_NAME: MonkeyWorkoutWidgets
        # Matches the app; Live Activities only show on iPhone (ActivityKit is off on iPad).
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  # Apple Watch companion (#56), embedded in the iOS app.
  MonkeyWorkoutWatch:
    type: application
    platform: watchOS
    sources:
      - path: MonkeyWorkoutWatch
        excludes: [MonkeyWorkoutWatch.entitlements, PrivacyInfo.xcprivacy]
      # Own privacy manifest: the Watch app reads UserDefaults and posts Hyrox races itself (#426).
      - path: MonkeyWorkoutWatch/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: WatchShared
      - path: MonkeyWorkoutWatchComplications/SharedSnapshot.swift
    dependencies:
      - target: MonkeyWorkoutWatchComplications
        embed: true
      - package: LiftSensor
    entitlements:
      path: MonkeyWorkoutWatch/MonkeyWorkoutWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: MonkeyWorkoutWatch/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        WKBackgroundModes: [workout-processing]
        MWAppGroup: $(APP_GROUP)
        NSHealthShareUsageDescription: Reads heart rate and active energy during your workouts.
        NSHealthUpdateUsageDescription: Saves your gym sessions and the sports you track (with their route) as workouts to Apple Health.
        NSMotionUsageDescription: Counts your reps and measures bar speed during workouts.
        NSLocationWhenInUseUsageDescription: Records the route, speed and elevation of the sports you track. The route is saved to Apple Health only.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: MonkeyWorkoutWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
  # Watch face complications (#190), embedded in the Watch app.
  MonkeyWorkoutWatchComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: MonkeyWorkoutWatchComplications
        excludes: [MonkeyWorkoutWatchComplications.entitlements]
      - path: WatchShared
    dependencies:
      # WatchShared carries Hyrox races (#426).
      - package: LiftSensor
    entitlements:
      path: MonkeyWorkoutWatchComplications/MonkeyWorkoutWatchComplications.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: MonkeyWorkoutWatchComplications/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MWAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp.Complications
        PRODUCT_NAME: MonkeyWorkoutWatchComplications
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  # UI regression tests in demo mode (#271).
  MonkeyWorkoutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MonkeyWorkoutUITests]
    dependencies:
      - target: MonkeyWorkout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MonkeyWorkout
schemes:
  MonkeyWorkout:
    build:
      targets:
        MonkeyWorkout: all
    test:
      config: Debug
      targets: [MonkeyWorkoutUITests]
    run:
      config: Debug
      # Local StoreKit testing in Xcode (#126): Pro products, CHF prices, free week. Device/TestFlight use App Store sandbox.
      storeKitConfiguration: Config/MonkeyWorkout.storekit
    archive:
      config: Release
  MonkeyWorkout Staging:
    build:
      targets:
        MonkeyWorkout: all
    run:
      config: Staging
    archive:
      config: Staging
